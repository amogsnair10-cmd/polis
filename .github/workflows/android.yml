name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
        working-directory: mobile
      - run: npm run web
        working-directory: mobile
      - run: npx cap add android
        working-directory: mobile
      - name: Use the Light Bulb icon
        run: |
          cd mobile
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp ../icons/icon-512.png "$d/ic_launcher.png"
            cp ../icons/icon-512.png "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done
      - name: Add the home-screen widget
        working-directory: mobile
        run: python3 native/patch.py
      - run: npx cap sync android
        working-directory: mobile
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk LightBulb.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Light Bulb (latest)
          body: Download LightBulb.apk on your Android phone and open it to install.
          prerelease: false
          make_latest: true
          files: LightBulb.apk
