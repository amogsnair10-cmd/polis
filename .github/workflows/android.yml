name: Build Android app
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'icons/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
        working-directory: mobile
      - run: npm run web
        working-directory: mobile
      - run: npx cap add android
        working-directory: mobile
      - name: Use the Light Bulb icon
        run: |
          cd mobile
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp ../icons/icon-512.png "$d/ic_launcher.png"
            cp ../icons/icon-512.png "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done
      - name: Add the home-screen widget
        working-directory: mobile
        run: python3 native/patch.py
      - run: npx cap sync android
        working-directory: mobile
      - name: Set the version (each build gets a higher number, as the Play Store needs)
        working-directory: mobile/android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
      - name: Build (signed release if the signing key secret exists, else a debug APK)
        working-directory: mobile/android
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lightbulb.jks"
            SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/lightbulb.jks -Pandroid.injected.signing.store.password=$KS_PASS -Pandroid.injected.signing.key.alias=lightbulb -Pandroid.injected.signing.key.password=$KS_PASS"
            ./gradlew assembleRelease bundleRelease --no-daemon $SIGN
            cp app/build/outputs/apk/release/app-release.apk ../../LightBulb.apk
            cp app/build/outputs/bundle/release/app-release.aab ../../LightBulb.aab
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../LightBulb.apk
          fi
      - name: Send to Google Play (internal testing), if the Play key secret exists
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        if: ${{ env.PLAY_JSON != '' && hashFiles('LightBulb.aab') != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.lightbulb.study
          releaseFiles: LightBulb.aab
          track: internal
          status: completed
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Light Bulb (latest)
          body: Download LightBulb.apk on your Android phone and open it to install.
          prerelease: false
          make_latest: true
          files: |
            LightBulb.apk
            LightBulb.aab
          fail_on_unmatched_files: false
