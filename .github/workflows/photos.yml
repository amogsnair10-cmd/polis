name: Lesson photos
on:
  workflow_dispatch:
    inputs:
      subjects:
        description: "Subject ids separated by spaces (blank = all)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: photos
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Find and grade photos
        run: python3 scripts/photos.py ${{ github.event.inputs.subjects }}
      - name: Commit
        if: always()
        run: |
          git config user.name "photos-bot"
          git config user.email "photos-bot@users.noreply.github.com"
          git add photos.json art/photos
          git commit -m "Lesson photos" || exit 0
          git pull --rebase -X ours origin main || true
          git push
