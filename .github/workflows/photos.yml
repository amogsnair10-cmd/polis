name: Lesson photos
on:
  workflow_dispatch:
    inputs:
      subjects:
        description: "Subject ids as JSON list (blank = all)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: photos
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJSON(github.event.inputs.subjects || '["psir","history","geography","environment","world","communism","astronomy","physics","chemistry","biology","quantum"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python3 scripts/photos.py ${{ matrix.subject }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos-${{ matrix.subject }}
          path: |
            photos-${{ matrix.subject }}.json
            art/photos/${{ matrix.subject }}
  merge:
    needs: find
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: "photos-*" }
      - name: Merge and commit
        run: |
          mkdir -p art/photos
          for d in parts/photos-*; do cp -r "$d"/art/photos/* art/photos/ 2>/dev/null || true; done
          python3 -c "
          import json,glob
          o=json.load(open('photos.json'))
          for f in glob.glob('parts/*/photos-*.json'): o.update(json.load(open(f)))
          json.dump(o,open('photos.json','w'),indent=0,ensure_ascii=False)
          print(len(o),'entries')"
          git config user.name "photos-bot"
          git config user.email "photos-bot@users.noreply.github.com"
          git add photos.json art/photos
          git commit -m "Lesson photos" || exit 0
          git push
